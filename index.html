<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смета за 5 минут</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>Смета за 5 минут</h1>
        <p>Заполните реквизиты и позиции — суммы рассчитаются автоматически.</p>
      </header>
      <h1 class="print-heading">Смета № <span id="print-estimate-number">—</span> от <span id="print-estimate-date"></span></h1>

      <section class="card" aria-labelledby="details-title">
        <h2 id="details-title">Реквизиты</h2>
        <div class="details-grid">
          <label>
            <span>От кого</span>
            <input type="text" name="sender" autocomplete="organization" placeholder="Компания или ваше имя">
          </label>
          <label>
            <span>Для кого</span>
            <input type="text" name="customer" placeholder="Заказчик">
          </label>
          <label>
            <span>Номер сметы</span>
            <input type="text" name="estimate-number" inputmode="numeric" placeholder="Например, 001">
          </label>
          <label>
            <span>Дата</span>
            <input id="estimate-date" type="date" name="estimate-date">
          </label>
        </div>
      </section>

      <section class="card positions-card" aria-labelledby="positions-title">
        <h2 id="positions-title">Позиции</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Наименование</th>
                <th scope="col">Количество</th>
                <th scope="col">Единица</th>
                <th scope="col">Цена</th>
                <th scope="col">Сумма</th>
                <th scope="col"><span class="visually-hidden">Действия</span></th>
              </tr>
            </thead>
            <tbody id="positions-body"></tbody>
          </table>
        </div>
        <button id="add-position" class="add-button" type="button">+ Добавить позицию</button>
        <div class="calculation-settings" aria-label="Настройки расчёта">
          <label>
            <span>Скидка, %</span>
            <input id="discount-rate" type="text" inputmode="decimal" value="0" aria-describedby="discount-hint">
            <span id="discount-hint" class="visually-hidden">Процент скидки от суммы позиций</span>
          </label>
          <label>
            <span>НДС, %</span>
            <input id="vat-rate" type="text" inputmode="decimal" value="0" aria-describedby="vat-hint">
            <span id="vat-hint" class="visually-hidden">Процент НДС от суммы со скидкой</span>
          </label>
          <label>
            <span>Валюта</span>
            <select id="currency" aria-label="Валюта сметы">
              <option value="₸">₸</option>
              <option value="₽">₽</option>
              <option value="$">$</option>
              <option value="€">€</option>
            </select>
          </label>
        </div>
      </section>

      <section class="total-card" aria-live="polite" aria-atomic="true">
        <div class="total-row">
          <span>Сумма</span>
          <output id="subtotal">0 ₸</output>
        </div>
        <div id="discount-row" class="total-row" hidden>
          <span>Скидка</span>
          <output id="discount-amount">0 ₸</output>
        </div>
        <div id="discounted-row" class="total-row" hidden>
          <span>Сумма со скидкой</span>
          <output id="discounted-total">0 ₸</output>
        </div>
        <div id="vat-row" class="total-row" hidden>
          <span>НДС</span>
          <output id="vat-amount">0 ₸</output>
        </div>
        <div class="total-row grand-total-row">
          <span>Итого к оплате</span>
          <strong id="grand-total">0 ₸</strong>
        </div>
      </section>

      <section class="card comment-card" aria-labelledby="comment-title">
        <h2 id="comment-title">Комментарий</h2>
        <textarea id="comment" rows="4" placeholder="Сроки выполнения, условия оплаты и другие детали"></textarea>
        <div class="screen-actions">
          <button id="print-estimate" class="primary-button" type="button">Сохранить PDF</button>
          <button id="copy-whatsapp" class="secondary-button" type="button">Скопировать для WhatsApp</button>
          <button id="new-estimate" class="secondary-button" type="button">Новая смета</button>
        </div>
        <p id="copy-status" class="copy-status" role="status" hidden>Скопировано ✓</p>
        <div id="copy-fallback" class="copy-fallback" hidden>
          <label for="copy-text">Скопируйте текст вручную</label>
          <textarea id="copy-text" rows="8" readonly></textarea>
        </div>
      </section>

      <p class="signature">Подпись ____________________</p>
    </main>

    <template id="position-template">
      <tr>
        <td data-label="Наименование">
          <input class="item-name" type="text" aria-label="Наименование позиции" placeholder="Название работы или товара">
        </td>
        <td data-label="Количество">
          <input class="item-quantity" type="text" inputmode="decimal" aria-label="Количество" placeholder="0">
        </td>
        <td data-label="Единица">
          <select class="item-unit" aria-label="Единица измерения">
            <option value="шт">шт</option>
            <option value="час">час</option>
            <option value="услуга">услуга</option>
          </select>
        </td>
        <td data-label="Цена">
          <input class="item-price" type="text" inputmode="decimal" aria-label="Цена" placeholder="0">
        </td>
        <td class="line-total-cell" data-label="Сумма">
          <output class="line-total">0 ₸</output>
        </td>
        <td class="row-actions-cell" data-label="Действия">
          <div class="row-actions">
            <button class="duplicate-button" type="button" aria-label="Дублировать позицию" title="Дублировать позицию" disabled>
              <span aria-hidden="true">⧉</span>
            </button>
            <button class="remove-button" type="button" aria-label="Удалить позицию" title="Удалить позицию">×</button>
          </div>
        </td>
      </tr>
    </template>

    <script src="script.js"></script>
  </body>
</html>
